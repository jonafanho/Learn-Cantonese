<app-page-layout titleKey="session.title">
	<div class="ion-padding">
		@if (section$ | async; as section) {
			@for (card of section.cards; track card.id) {
				<div class="ion-text-center">
					<p class="ion-text-secondary">{{ card.promptKey | transloco }}</p>
					<app-audio-playback
						[jyutping]="card.romanizationVisualFonts"
						[audioSrc]="contentService.resolveAssetPath(packId, card.audioAssetPath)"/>
					<app-tone-tracing [toneSequence]="card.toneSequence"/>
				</div>
			}
		}
	</div>
</app-page-layout>
